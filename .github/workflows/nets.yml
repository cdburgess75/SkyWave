name: Mirror live nets

on:
  schedule:
    - cron: "*/10 * * * *"   # requested every 10 min; GitHub's scheduler is
                             # best-effort and in practice delivers ~hourly.
                             # The app tolerates that — see NETS_MIRROR_MAX_AGE.
  workflow_dispatch:          # manual run button

permissions:
  contents: write

# Shared with eibi.yml: both jobs force-push the `data` branch, so they must
# never run at the same time. cancel-in-progress would drop a queued publish.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  nets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch nets from NetLogger servers
        run: node scripts/fetch-nets.mjs
      - name: Publish to single-commit data branch
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Carry over whatever the EiBi job published; we only regenerate ours.
          if git clone --depth 1 --branch data "$REMOTE" prev 2>/dev/null; then
            for f in prev/*; do
              b="$(basename "$f")"
              [ -e "out/$b" ] || cp "$f" "out/$b"
            done
          fi
          cd out
          git init -b data
          git config user.name "skywave-nets-mirror"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "nets @ $(date -u +%FT%TZ)"
          git push --force "$REMOTE" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
