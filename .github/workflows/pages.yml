name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages is already enabled for this repo; keep this false so a
          # transient Pages-API hiccup can't send the action down the
          # "create a new Pages site" path (which the workflow token can't do).
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The v4 default gives up after 10 min of "deployment_queued" and
          # cancels the deploy — which is what killed v2026.07.29.043 on
          # 2026-08-06 while Pages was backed up. The push looked successful,
          # the site silently stayed on the previous release, and the only
          # symptom was a stale version number on a phone. Wait longer instead;
          # a slow deploy is not a failed one.
          timeout: 1800000        # 30 min
          error_count: 20         # tolerate more transient status-poll errors
